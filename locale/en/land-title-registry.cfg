[tips-and-tricks-item-category]
land-title-registry=Land Title Registry

[tips-and-tricks-item-name]
ltr-tip-intro=Land Title Registry: land rights
ltr-tip-raising=Raising land
ltr-tip-lowering=Lowering land
ltr-tip-outposts=Outposts

[tips-and-tricks-item-description]
ltr-tip-intro=The map is divided into cells, each on a ladder of building rights: Wilderness (elevated rails only) → Trail (belts, rails, pipes) → Rampart (adds turrets, walls, power) → Deed (everything, including artillery). Rights are paid for with Land points, earned by researching Land grants.
ltr-tip-raising=Take out the Survey tool (__CONTROL__ltr-get-survey-tool__ or the shortcut-bar button) and drag across cells: every covered cell rises one rung. Shift-drag jumps straight to Deed; __CONTROL__ltr-get-rampart-tool__ takes out a variant tool that drags straight to Rampart - reaching a state costs the same total no matter how you get there. New claims must touch land you already own.
ltr-tip-lowering=Right-drag with the Survey tool to lower cells one rung, refunding part of the price; Shift-right-drag sells everything back to Wilderness in one stroke. A cell can only shed a right nothing on it is using - remove the buildings first.
ltr-tip-outposts=Research Outpost grants to found Deeds deep in the wilderness, no adjacency required - one concurrent outpost per researched level. Founding asks for confirmation and costs the normal Deed price; the slot is returned once the outpost's territory grows to touch your mainland.
