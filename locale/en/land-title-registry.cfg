[technology-description]
ltr-land-grants=Each completed level grants your force Land points to claim and upgrade cells with.
ltr-outpost-grants=Each level permits one more concurrent outpost: a Deed founded anywhere in the wilderness, no adjacency required. A slot is returned when the outpost's territory grows to connect with your mainland.

