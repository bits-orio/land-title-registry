[item-name]
ltr-survey-tool=Survey tool
ltr-survey-tool-rampart=Survey tool (Rampart)

[item-description]
ltr-survey-tool=Raise and lower land rights, cell by cell.\n[font=default-bold]Drag[/font]: raise one rung (Wilderness → Trail → Rampart → Deed)\n[font=default-bold]Right-drag[/font]: lower one rung, with a partial refund\n[font=default-bold]Shift-drag[/font]: jump to Deed · [font=default-bold]Shift-right-drag[/font]: sell everything back to Wilderness\n[font=default-bold]Ctrl+Shift-drag[/font]: jump to Rampart — jumping costs the same as stepping, by design. Each gesture's action is remappable in per-player settings. __CONTROL__ltr-get-rampart-tool__ takes out a variant tool whose plain drag jumps straight to Rampart.
ltr-survey-tool-rampart=The Rampart specialist.\n[font=default-bold]Drag[/font]: claim or upgrade straight to Rampart\n[font=default-bold]Shift-drag[/font]: jump to Deed\n[font=default-bold]Right-drag[/font]: lower one rung · [font=default-bold]Shift-right-drag[/font]: sell everything back to Wilderness

[entity-name]
ltr-cell-wilderness=Wilderness
ltr-cell-trail=Trail
ltr-cell-rampart=Rampart

[entity-description]
ltr-cell-wilderness=Unclaimed land. Only elevated rails and their support pylons may be built here - viaducts fly over what you do not own. Claim the cell with the survey tool to build more.
ltr-cell-trail=A claimed transport corridor. Belts, rails with their signals and stops, and pipes may be built here. Power and defense need a Rampart.
ltr-cell-rampart=A claimed defensive position. Everything Trail permits, plus turrets, walls, gates, landmines, radar, and power. Factories and everything else need a Deed.

[shortcut-name]
ltr-get-survey-tool=Survey tool
ltr-toggle-chronicle=Cell standings (map)

[controls]
ltr-get-survey-tool=Get survey tool
ltr-get-rampart-tool=Get survey tool (Rampart)
ltr-toggle-chronicle=Toggle cell standings on the map (off by default)

