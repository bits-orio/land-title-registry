[mod-setting-description]
ltr-starting-points=Land points granted to each force when it is created.
ltr-refund-percent=Percentage of the step price refunded when a cell is downgraded.
ltr-points-per-level=Land points granted per completed Land grants research level.
ltr-tech-cost-multiplier=Globally scales the science cost of the Land grants research chain.
ltr-tech-tiers=Advanced: pin the Land grants ladder explicitly instead of deriving it from the tech tree. Semicolon-separated tiers, each a comma-separated list of science packs added at that tier. Leave empty to derive.
ltr-settlement-charter=One-time Land points granted the first time a force reaches each new planet (the home planet is covered by the starting grant).
ltr-print-claims=Print a line to the acting team's chat for every survey-tool action - who acted, how many cells, the cost or refund, and a map ping. The line never leaves the team; it is the audit trail for a shared purse. Record-breaking Deeds are always announced to the teams involved.
ltr-show-celebrations=Show the on-screen banner when your team takes a cell's first or fastest Deed.
ltr-cell-size=Edge length of a Land Title Registry cell, in tiles. Changing this on an existing save releases all claims with a full refund - it cannot be migrated.
ltr-transit-additions=Comma-separated entity prototype names, or type:<type> entries, additionally allowed on Trail cells. Host override channel; precedence is mod defaults < mod-data declarations < these settings.
ltr-transit-removals=Comma-separated entity prototype names, or type:<type> entries, removed from Trail rights (they then require a Deed).
ltr-rampart-additions=Comma-separated entity prototype names, or type:<type> entries, additionally allowed on Rampart cells. Host override channel; precedence is mod defaults < mod-data declarations < these settings.
ltr-rampart-removals=Comma-separated entity prototype names, or type:<type> entries, removed from Rampart rights (they then require a Deed).
ltr-border-width=Width of your force's territory border lines, in pixels, for your view only. Map-view lines draw one pixel wider.
ltr-border-color-trail=Color and opacity of your force's Trail borders, for your view only.
ltr-border-color-rampart=Color and opacity of your force's Rampart borders, for your view only.
ltr-border-color-deed=Color and opacity of your force's Deed borders, for your view only.
ltr-chronicle-contested-only=Draw map-view cell standings only for cells more than one team has deeded. On a busy server this hides the cells nobody is racing for. Your own view only.
ltr-confirm-lowering=Show a confirmation dialog before a lowering gesture applies. Downgrades refund only a fraction of the invested price, and an accidental right-drag should not learn that the hard way. Turn off once the economy is second nature.
ltr-gesture-drag=Action performed by dragging with the survey tool. Selection border colors follow the gesture, not the chosen action.
ltr-gesture-shift-drag=Action performed by Shift-dragging with the survey tool. Selection border colors follow the gesture, not the chosen action.
ltr-gesture-ctrl-shift-drag=Action performed by Ctrl+Shift-dragging with the survey tool. Selection border colors follow the gesture, not the chosen action.
ltr-gesture-right-drag=Action performed by right-dragging with the survey tool. Selection border colors follow the gesture, not the chosen action.
ltr-gesture-shift-right-drag=Action performed by Shift+right-dragging with the survey tool. Selection border colors follow the gesture, not the chosen action.

