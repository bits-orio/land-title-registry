[tips-and-tricks-item-category]
land-title-registry=Land Title Registry

[tips-and-tricks-item-name]
ltr-tip-intro=Land Title Registry: land rights
ltr-tip-raising=Raising land
ltr-tip-lowering=Lowering land

[tips-and-tricks-item-description]
ltr-tip-intro=The map is divided into cells, each on a ladder of building rights: Wilderness (nothing) → Trail (belts, rails, pipes) → Rampart (adds turrets, walls, power) → Deed (everything, including artillery). Rights are paid for with Land points, earned by researching Land grants.
ltr-tip-raising=Take out the Survey tool (__CONTROL__ltr-get-survey-tool__ or the shortcut-bar button) and drag across cells: every covered cell rises one rung. Drag again to keep rising - reaching a state costs the same total no matter how you get there. New claims must touch land you already own.
ltr-tip-lowering=Right-drag with the Survey tool to lower cells one rung, refunding part of the price. A cell can only shed a right nothing on it is using - remove the buildings first. Shortcuts for veterans: Shift-drag jumps straight to Deed, Shift-right-drag to Rampart.
