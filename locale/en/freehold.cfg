[item-name]
fh-survey-tool=Survey tool

[item-description]
fh-survey-tool=Raise and lower land rights, cell by cell.\n[font=default-bold]Drag[/font]: raise one rung (Wilderness → Trail → Rampart → Deed)\n[font=default-bold]Right-drag[/font]: lower one rung, with a partial refund\nAdvanced: Shift-drag jumps to Deed, Shift-right-drag to Rampart — same total price, by design.

