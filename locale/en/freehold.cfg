fh-print-claims=Print claim, upgrade, and downgrade summaries to the acting force's chat, with a clickable map tag.
fh-cell-size=Edge length of a Freehold cell, in tiles. Changing this on an existing save releases all claims with a full refund - it cannot be migrated.

