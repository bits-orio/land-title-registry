[tips-and-tricks-item-category]
freehold=Freehold

[tips-and-tricks-item-name]
fh-tip-freehold=Freehold: land rights
fh-tip-raising=Raising land
fh-tip-lowering=Lowering land

[tips-and-tricks-item-description]
fh-tip-freehold=The map is divided into cells, each on a ladder of building rights: Wilderness (nothing) → Trail (belts, rails, pipes) → Rampart (adds turrets, walls, power) → Deed (everything, including artillery). Rights are paid for with Land points, earned by researching Land grants.
fh-tip-raising=Take out the Survey tool (__CONTROL__fh-get-survey-tool__ or the shortcut-bar button) and drag across cells: every covered cell rises one rung. Drag again to keep rising - reaching a state costs the same total no matter how you get there. New claims must touch land you already own.
fh-tip-lowering=Right-drag with the Survey tool to lower cells one rung, refunding part of the price. A cell can only shed a right nothing on it is using - remove the buildings first. Shortcuts for veterans: Shift-drag jumps straight to Deed, Shift-right-drag to Rampart.
