[mod-setting-description]
fh-starting-points=Land points granted to each force when it is created.
fh-refund-percent=Percentage of the step price refunded when a cell is downgraded.
fh-points-per-level=Land points granted per completed Land grants research level.
fh-tech-cost-multiplier=Globally scales the science cost of the Land grants research chain.
fh-tech-tiers=Advanced: pin the Land grants ladder explicitly instead of deriving it from the tech tree. Semicolon-separated tiers, each a comma-separated list of science packs added at that tier. Leave empty to derive.
fh-settlement-charter=One-time Land points granted the first time a force reaches each new planet (the home planet is covered by the starting grant).
fh-print-claims=Print claim, upgrade, and downgrade summaries to the acting force's chat, with a clickable map tag.

